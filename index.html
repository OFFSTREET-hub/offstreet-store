<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFSTREET</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 18px;border-bottom:1px solid #333;
 display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:26px;font-weight:900;letter-spacing:4px}
button{
 background:#fff;color:#111;border:0;padding:12px 17px;
 border-radius:5px;font-weight:bold;cursor:pointer;
}
.hero{padding:45px 20px 25px}
.hero small{color:#999;letter-spacing:3px}
.hero h1{font-size:42px;margin:12px 0}
.hero p{color:#aaa}
.rail{
 display:flex;gap:15px;overflow-x:auto;padding:20px;
 scroll-snap-type:x mandatory;
}
.rail::-webkit-scrollbar{height:5px}
.rail::-webkit-scrollbar-thumb{background:#555}
.product{
 min-width:220px;width:220px;scroll-snap-align:start;
 background:#202020;border-radius:10px;overflow:hidden;
}
.photo{
 height:280px;background:#292929;display:flex;
 align-items:center;justify-content:center;
 font-size:100px;overflow:hidden;
}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}
.info h3{margin:0 0 8px}
.info p{color:#aaa;margin:0 0 12px}
section{padding:10px 20px}
footer{padding:30px 20px;color:#777;text-align:center}
.overlay{
 display:none;position:fixed;inset:0;background:#000c;
 z-index:10;align-items:center;justify-content:center;padding:15px;
}
.panel{
 background:#202020;padding:22px;border-radius:12px;
 width:100%;max-width:420px;max-height:90vh;overflow:auto;
}
.panel input,.panel textarea{
 display:block;width:100%;padding:13px;margin:10px 0;
 background:#111;color:white;border:1px solid #444;border-radius:5px;
}
.panel button{margin:5px 0}
.close{background:#444;color:white}
#cartItems{padding:10px;color:#ddd}
</style>
</head>

<body>

<header>
 <div class="logo">OFFSTREET</div>
 <div>
  <button onclick="openCart()">CART (<span id="cartCount">0</span>)</button>
 </div>
</header>

<div class="hero">
 <small>OFF THE RAIL.</small>
 <h1>WEAR YOUR<br>OWN RULES.</h1>
 <p>Discover your street. Find your style.</p>
</div>

<section>
 <h2>THE COLLECTION</h2>
 <p style="color:#888">Swipe to explore →</p>
</section>

<div class="rail" id="rail"></div>

<section>
 <button onclick="openAdmin()">＋ ADD PRODUCTS</button>
</section>

<footer>OFFSTREET © 2026</footer>

<!-- PRODUCT DETAILS -->
<div class="overlay" id="details">
 <div class="panel" id="detailPanel"></div>
</div>

<!-- ADMIN -->
<div class="overlay" id="admin">
 <div class="panel">
  <h2>ADD NEW JACKET</h2>
  <input id="pName" placeholder="Jacket name">
  <input id="pPrice" type="number" placeholder="Price (₹)">
  <textarea id="pDesc" placeholder="Description"></textarea>
  <label>Upload jacket photo</label>
  <input id="pImage" type="file" accept="image/*">
  <button onclick="addProduct()">SAVE PRODUCT</button>
  <button class="close" onclick="closeAdmin()">CLOSE</button>
 </div>
</div>

<!-- CART -->
<div class="overlay" id="cart">
 <div class="panel">
  <h2>YOUR CART</h2>
  <div id="cartItems"></div>
  <button class="close" onclick="closeCart()">CLOSE</button>
 </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("offstreet_products") || "null") || [
 {name:"Street Oversized Jacket",price:2499,desc:"Oversized streetwear style.",image:""},
 {name:"Urban Black Jacket",price:2999,desc:"Classic black streetwear.",image:""},
 {name:"Essential Puffer",price:3499,desc:"Everyday winter essential.",image:""}
];

let cart = [];

function save(){
 localStorage.setItem("offstreet_products",JSON.stringify(products));
}

function render(){
 const rail=document.getElementById("rail");
 rail.innerHTML="";
 products.forEach((p,i)=>{
  rail.innerHTML+=`
   <div class="product">
    <div class="photo">
     ${p.image?`<img src="${p.image}">`:"🧥"}
    </div>
    <div class="info">
     <h3>${p.name}</h3>
     <p>₹${p.price}</p>
     <button onclick="showDetails(${i})">VIEW PRODUCT</button>
    </div>
   </div>`;
 });
}

function showDetails(i){
 const p=products[i];
 document.getElementById("detailPanel").innerHTML=`
  <h2>${p.name}</h2>
  <div class="photo" style="height:250px">
   ${p.image?`<img src="${p.image}">`:"🧥"}
  </div>
  <h3>₹${p.price}</h3>
  <p>${p.desc||""}</p>
  <button onclick="addCart(${i})">ADD TO CART</button>
  <button class="close" onclick="closeDetails()">CLOSE</button>
 `;
 document.getElementById("details").style.display="flex";
}

function closeDetails(){
 document.getElementById("details").style.display="none";
}

function addCart(i){
 cart.push(products[i]);
 document.getElementById("cartCount").textContent=cart.length;
 closeDetails();
 alert("Added to cart!");
}

function openCart(){
 document.getElementById("cartItems").innerHTML=
 cart.length?cart.map(p=>`<p>${p.name} — ₹${p.price}</p>`).join(""):"Your cart is empty.";
 document.getElementById("cart").style.display="flex";
}
function closeCart(){
 document.getElementById("cart").style.display="none";
}

function openAdmin(){
 document.getElementById("admin").style.display="flex";
}
function closeAdmin(){
 document.getElementById("admin").style.display="none";
}

function addProduct(){
 const name=document.getElementById("pName").value.trim();
 const price=document.getElementById("pPrice").value;
 const desc=document.getElementById("pDesc").value;
 const file=document.getElementById("pImage").files[0];

 if(!name||!price){
  alert("Enter jacket name and price");
  return;
 }

 if(file){
  const reader=new FileReader();
  reader.onload=function(){
   products.push({name,price,desc,image:reader.result});
   save();render();closeAdmin();
   alert("Product added!");
  };
  reader.readAsDataURL(file);
 }else{
  products.push({name,price,desc,image:""});
  save();render();closeAdmin();
  alert("Product added!");
 }
 document.getElementById("pName").value="";
 document.getElementById("pPrice").value="";
 document.getElementById("pDesc").value="";
 document.getElementById("pImage").value="";
}

render();
</script>

</body>
  </html>
